<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow • .NET Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>TaskFlow</h1>
                    <span class="badge dotnet-badge">.NET 10 + EF Core</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="date-display" id="currentDate"></div>
                <a href="/scalar/v1" target="_blank" class="btn btn-ghost" title="Interactive API Docs">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>API Docs</span>
                </a>
                <button id="themeToggleBtn" class="btn btn-icon" title="Toggle Theme" aria-label="Toggle Theme">
                    <span class="theme-icon-dark">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </span>
                    <span class="theme-icon-light">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                </button>
            </div>
        </header>

        <!-- Main Container -->
        <main class="main-content">
            <!-- Stats Dashboard Cards (Interactive Filters) -->
            <section class="stats-grid">
                <button type="button" class="stat-card active" data-filter="all" id="statCardTotal" title="Filter by all tasks">
                    <div class="stat-icon total-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Total Tasks</span>
                        <span class="stat-value" id="statTotal">0</span>
                    </div>
                </button>

                <button type="button" class="stat-card" data-filter="pending" id="statCardPending" title="Filter by pending tasks">
                    <div class="stat-icon pending-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Pending</span>
                        <span class="stat-value" id="statPending">0</span>
                    </div>
                </button>

                <button type="button" class="stat-card" data-filter="completed" id="statCardCompleted" title="Filter by completed tasks">
                    <div class="stat-icon completed-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-header">
                            <span class="stat-label">Completed</span>
                            <span class="stat-pct" id="statPercent">0%</span>
                        </div>
                        <span class="stat-value" id="statCompleted">0</span>
                    </div>
                </button>

                <button type="button" class="stat-card" data-filter="overdue" id="overdueCard" title="Filter by overdue tasks">
                    <div class="stat-icon overdue-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Overdue</span>
                        <span class="stat-value" id="statOverdue">0</span>
                    </div>
                </button>
            </section>

            <!-- Completion Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>

            <!-- Task Creation Box -->
            <section class="create-card">
                <form id="createTodoForm">
                    <div class="quick-add-row">
                        <input type="text" id="newTitle" placeholder="Add a new task (e.g., 'Finish project proposal')..." required autocomplete="off">
                        <button type="button" id="toggleDetailsBtn" class="btn btn-secondary btn-icon-text" title="More options">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                            <span>Options</span>
                        </button>
                        <button type="submit" class="btn btn-primary btn-submit">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            <span>Add Task</span>
                        </button>
                    </div>

                    <!-- Collapsible Details -->
                    <div class="details-panel" id="createDetailsPanel">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="newDescription">Notes / Description</label>
                                <textarea id="newDescription" rows="2" placeholder="Add additional context or notes..."></textarea>
                            </div>
                            <div class="form-row-compact">
                                <div class="form-group">
                                    <label for="newCategory">Category</label>
                                    <div class="input-with-datalist">
                                        <input type="text" id="newCategory" list="categoryOptions" placeholder="General">
                                        <datalist id="categoryOptions">
                                            <option value="Work">
                                            <option value="Personal">
                                            <option value="Health">
                                            <option value="Learning">
                                            <option value="Finance">
                                        </datalist>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="newPriority">Priority</label>
                                    <select id="newPriority">
                                        <option value="0">Low</option>
                                        <option value="1" selected>Medium</option>
                                        <option value="2">High</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="newDueDate">Due Date</label>
                                    <input type="datetime-local" id="newDueDate">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Filters & Controls Bar -->
            <section class="controls-card">
                <div class="controls-top">
                    <!-- Search Input -->
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchInput" placeholder="Search tasks by title or note...">
                        <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">&times;</button>
                    </div>

                    <!-- Status Filter Tabs -->
                    <div class="status-tabs">
                        <button class="tab-btn active" data-status="all">All</button>
                        <button class="tab-btn" data-status="pending">Pending</button>
                        <button class="tab-btn" data-status="completed">Completed</button>
                        <button class="tab-btn" data-status="overdue">Overdue</button>
                    </div>
                </div>

                <div class="controls-bottom">
                    <!-- Category Chips -->
                    <div class="category-chips-wrapper">
                        <span class="filter-label">Categories:</span>
                        <div class="chips-container" id="categoryChips">
                            <button class="chip active" data-category="All">All</button>
                        </div>
                    </div>

                    <!-- Priority & Sorting Dropdowns -->
                    <div class="sort-priority-controls">
                        <div class="select-wrapper">
                            <label for="priorityFilter">Priority:</label>
                            <select id="priorityFilter">
                                <option value="all">All</option>
                                <option value="2">🔴 High</option>
                                <option value="1">🟡 Medium</option>
                                <option value="0">🟢 Low</option>
                            </select>
                        </div>
                        <div class="select-wrapper">
                            <label for="sortBySelect">Sort by:</label>
                            <select id="sortBySelect">
                                <option value="createdAt" selected>Newest First</option>
                                <option value="dueDate">Due Date</option>
                                <option value="priority">Priority</option>
                                <option value="title">Title (A-Z)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Bulk actions & Task List Header -->
            <div class="list-meta-bar">
                <span class="tasks-count-display" id="tasksCountDisplay">Showing 0 tasks</span>
                <div class="bulk-actions">
                    <button id="clearCompletedBtn" class="btn btn-sm btn-ghost text-danger">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        <span>Clear Completed</span>
                    </button>
                </div>
            </div>

            <!-- Task List -->
            <div class="todos-container" id="todosContainer">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <span>Loading tasks...</span>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>TaskFlow &bull; Powered by ASP.NET Core &amp; EF Core SQLite</p>
        </footer>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="btn btn-icon modal-close-btn" id="closeModalBtn" title="Close">&times;</button>
            </div>
            <form id="editTodoForm">
                <input type="hidden" id="editTodoId">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="editTitle">Task Title *</label>
                        <input type="text" id="editTitle" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label for="editDescription">Description / Note</label>
                        <textarea id="editDescription" rows="3" maxlength="1000"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editCategory">Category</label>
                            <input type="text" id="editCategory" maxlength="50">
                        </div>
                        <div class="form-group">
                            <label for="editPriority">Priority</label>
                            <select id="editPriority">
                                <option value="0">Low</option>
                                <option value="1">Medium</option>
                                <option value="2">High</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editDueDate">Due Date</label>
                            <input type="datetime-local" id="editDueDate">
                        </div>
                        <div class="form-group checkbox-group">
                            <label class="custom-checkbox-container">
                                <input type="checkbox" id="editIsCompleted">
                                <span class="checkmark"></span>
                                <span class="checkbox-label">Mark as completed</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Floating Toast Notification System -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/app.js"></script>
</body>
</html>
